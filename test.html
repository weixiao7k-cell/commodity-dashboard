<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图表测试</title>
<style>
body { margin:0; background:#0a0e17; color:#e2e8f0; font-family:sans-serif; }
#test { width:100%; height:300px; }
#log { padding:10px; font-size:13px; color:#94a3b8; }
</style>
</head>
<body>
<div id="log">加载中...</div>
<div id="test"></div>
<script src="js/echarts.min.js"></script>
<script src="js/data-embed.js"></script>
<script>
var log = document.getElementById('log');
function msg(t) { log.innerHTML += '<br>' + t; }

msg('ECharts版本: ' + (typeof echarts !== 'undefined' ? echarts.version : '未加载'));
msg('EMBEDDED_DATA: ' + (typeof EMBEDDED_DATA !== 'undefined' ? '已加载' : '未加载'));

if (typeof EMBEDDED_DATA !== 'undefined') {
    msg('groups: ' + EMBEDDED_DATA.groups.length);
    msg('quotes: ' + Object.keys(EMBEDDED_DATA.quotes).length);
    msg('kline keys: ' + Object.keys(EMBEDDED_DATA.kline).join(', '));

    var kline = EMBEDDED_DATA.kline['fuGC_day'];
    if (kline) {
        msg('fuGC_day: ' + kline.length + '条, 首条: ' + JSON.stringify(kline[0]));

        // 尝试渲染图表
        try {
            var chart = echarts.init(document.getElementById('test'));
            var dates = kline.map(function(d) { return d.date; });
            var ohlc = kline.map(function(d) { return [d.open, d.close, d.low, d.high]; });

            chart.setOption({
                backgroundColor: 'transparent',
                animation: false,
                xAxis: { type: 'category', data: dates },
                yAxis: { scale: true },
                series: [{
                    type: 'candlestick',
                    data: ohlc,
                    itemStyle: { color: '#ef4444', color0: '#10b981', borderColor: '#ef4444', borderColor0: '#10b981' }
                }]
            });
            msg('图表渲染成功! 宽度=' + chart.getWidth() + ' 高度=' + chart.getHeight());
        } catch(e) {
            msg('图表渲染失败: ' + e.message);
        }
    } else {
        msg('fuGC_day 数据不存在!');
    }
}
</script>
</body>
</html>
